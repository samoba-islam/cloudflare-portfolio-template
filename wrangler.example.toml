name = "my-portfolio"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets from the built frontend
[assets]
directory = "./frontend/dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "<YOUR_DATABASE_NAME>" # E.g., portfolio-db
database_id = "<YOUR_DATABASE_ID>"

# KV Namespace binding 
[[kv_namespaces]]
binding = "CACHE"
id = "<YOUR_KV_NAMESPACE_ID>"

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://<YOUR_CUSTOM_DOMAIN_OR_PAGES_DEV>"
# Optional: comma-separated allowlist for multiple frontend domains
# CORS_ORIGINS = "https://<YOUR_PAGES_DOMAIN>,https://<YOUR_CUSTOM_DOMAIN>"

# Dev environment overrides
[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"
